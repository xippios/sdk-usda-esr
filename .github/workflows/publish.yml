name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Is this push a release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::notice title=release-check::runs on main only, not on $REF; no tag"
            exit 0
          fi
          pyproject_changed=1
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$SHA")"
            if ! grep -qx 'pyproject.toml' <<<"$changed"; then
              pyproject_changed=0
              if ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
                exit 0
              fi
            fi
          fi
          version="$(uv version --short)"
          if answer="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" 2>&1)"; then
            exit 0
          elif ! grep -q 'HTTP 404' <<<"$answer"; then
            echo "::error title=release-check::cannot read tag v${version}: ${answer}"
            exit 1
          fi
          heading="## [${version}] - "
          if ! awk -v h="$heading" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            if [ "$pyproject_changed" = 1 ]; then
              echo "::notice title=release-check::pyproject.toml names ${version}, but CHANGELOG.md has no '${heading}' heading; no tag"
            fi
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    needs: release-check
    if: needs.release-check.outputs.version != ''
    uses: ./.github/workflows/ci.yml

  tag:
    name: tag
    needs: [release-check, ci]
    if: needs.release-check.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a pyproject with [tool.uv.sources]
        run: |
          if grep -q '^\[tool\.uv\.sources\]' pyproject.toml; then
            echo "::error title=release::pyproject.toml has [tool.uv.sources]: a git-pinned core cannot be published"
            echo "Remove the pin and raise core_version to the core release in a PR of its own (/release-prep)."
            exit 1
          fi
      - name: Tag the merge commit with its CHANGELOG section
        id: tag
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          message="${RUNNER_TEMP}/tag-message.md"
          awk -v h="## [${VERSION}] - " '
            index($0, h) == 1 { on = 1; print; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$message"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --cleanup=whitespace --file="$message" "$tag" "$SHA"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that the tag matches pyproject version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match project version ${version}"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
