[project]
name = "xippios-usda-esr"
version = "0.3.0"
description = "Typed client, MCP tools and HTTP routes for USDA FAS Export Sales Reporting"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "XIPPIOS GmbH" }]
keywords = ["sdk", "usda-esr", "mcp", "httpx", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "xippios-core~=0.5.0",
  "xippios-usda-fas~=0.1.0",
]

[project.optional-dependencies]
mcp = ["xippios-core[mcp]~=0.5.0"]
http = ["xippios-core[http]~=0.5.0"]
testing = ["xippios-core[testing]~=0.5.0"]

[project.scripts]
# The servers' entry points, the template's; a script of the package's own goes after them.
xippios-usda-esr-mcp = "xippios.usda.esr.mcp:run"

[project.urls]
Homepage = "https://github.com/xippios/sdk-usda-esr"
Upstream = "https://www.fas.usda.gov/programs/export-sales-reporting-program"
Changelog = "https://github.com/xippios/sdk-usda-esr/blob/main/CHANGELOG.md"
Issues = "https://github.com/xippios/sdk-usda-esr/issues"

[dependency-groups]
# ruff is pinned to the rev of the ruff-pre-commit hook in .pre-commit-config.yaml, so a new
# lock does not drift from the hook; the two move together.
dev = [
  "ruff==0.17.1",
  "mypy>=1.18",
  "pre-commit>=4",
  "pytest>=8",
  "respx>=0.22",
  "anyio>=4",
  "detect-secrets>=1.5",
]

[tool.uv.sources]
# Development only: xippios-core from git, for a core change that is not released yet.
# While the pin is set, uv takes core from it and ignores the version bound above.
# Before a release, remove the pin and raise core_version to the release that carries
# the pinned change: X.Y.Z with Z the patch that shipped it, or X.Y.0 when the minor
# itself did; still one minor. Then uv lock:
#   uvx --from 'copier>=9.19' copier update --defaults --vcs-ref=:current: -d core_git_ref= -d core_version=X.Y.Z
# The removal is a PR of its own, merged before the release PR; /release-prep and
# publish.yml refuse a pinned release.
xippios-core = { git = "https://github.com/xippios/sdk-core.git", rev = "4060d9615012b09487d87a51064c610de34be069" }  # pragma: allowlist secret (a git ref, not a key)
xippios-usda-fas = { git = "https://github.com/xippios/sdk-usda-fas.git", rev = "fdb28c2a747b0597a8bcd0fa0d43e629a33b5e57" }  # pragma: allowlist secret (a git ref, not a key)

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xippios"]

[tool.hatch.build.targets.sdist]
# Anchored: hatch reads gitignore-style patterns, so a bare README.md would match a
# README.md in any directory. The sdist ships no tests; they live in the repository.
include = ["/src", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The ADR index script and the two release scripts are the organization's one version each,
# carried byte for byte, so ruff leaves them alone; mypy still checks them.
extend-exclude = [
  "docs",
  ".claude",
  "scripts/adr_index.py",
  "scripts/changelog_assemble.py",
  "scripts/release_prepare.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PTH", "PT", "T20", "C4"]
ignore = [
  "ANN401", # Any is allowed where upstream payloads are untyped by nature
  "D105",   # magic methods need no docstring
  "D107",   # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["xippios.usda.esr"]
known-third-party = ["xippios.core", "xippios.usda.fas"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
# record_property, in a live test say, warns under xunit2 when a run writes --junitxml.
junit_family = "xunit1"
